name: HappyGrandma Docker Build

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.server
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/happygrandma-server:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/happygrandma-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push UI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ui
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/happygrandma-ui:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/happygrandma-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
