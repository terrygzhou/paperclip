name: Refresh Lockfile

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: refresh-lockfile-master
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Resolution-only installs do not populate the package store. Do not
          # claim the shared cache key with an empty archive before full installs.
          package-manager-cache: false

      - name: Refresh pnpm lockfile
        run: pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile

      - name: Fail on unexpected file changes
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

      - name: Create or update pull request
        id: upsert-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged, nothing to do."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="chore/refresh-lockfile"
          git config user.name "lockfile-bot"
          git config user.email "lockfile-bot@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): refresh pnpm-lock.yaml"
          git push --force origin "$BRANCH"

          # GITHUB_TOKEN cannot use the GraphQL createPullRequest mutation
          # (used by gh pr create). The REST API works with the declared
          # contents:write + pull-requests:write permissions on push events.

          # Reuse an open PR whose head is in this repository only, so a
          # fork push cannot be mistaken for the real refresh PR.
          pr_url="$(curl -s -f -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/pulls?state=open&head=$REPO:$BRANCH&per_page=1" | python3 -c 'import json,sys; prs=json.load(sys.stdin); print(prs[0]["html_url"] if prs and prs[0]["head"]["repo"]["full_name"]==sys.argv[1] else "")' "$REPO" | tr -d '[:space:]')"

          if [ -z "$pr_url" ]; then
            payload="$(python3 -c 'import json,sys; print(json.dumps({"head":"{}:{}".format(sys.argv[1],sys.argv[2]),"base":"master","title":"chore(lockfile): refresh pnpm-lock.yaml","body":"Auto-generated lockfile refresh after dependencies changed on master. This PR only updates pnpm-lock.yaml."}))' "$REPO" "$BRANCH")"
            pr_url="$(curl -s -f -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" -d "$payload" "https://api.github.com/repos/$REPO/pulls" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("html_url",""))')"
            echo "Created new PR: $pr_url"
          else
            echo "PR already exists: $pr_url"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Auto-merge lockfile PR (squash, delete branch)
        if: steps.upsert-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL="${{ steps.upsert-pr.outputs.pr_url }}"
          REPO="$(python3 -c 'import sys; p=sys.argv[1].split("/"); print("/".join(p[2:4]))' "$PR_URL")"
          PR_NUMBER="$(python3 -c 'import sys; p=sys.argv[1].split("/"); print(p[-1])' "$PR_URL")"
          echo "Merging PR #${PR_NUMBER} on ${REPO}"
          curl -s -f -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"merge_method":"squash","delete_branch":true}' \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/merge" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Merged:", d.get("merged"), d.get("sha") or d.get("message"))'
