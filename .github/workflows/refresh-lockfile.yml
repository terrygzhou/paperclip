name: Refresh Lockfile

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: refresh-lockfile-master
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # Resolution-only installs do not populate the package store. Do not
          # claim the shared cache key with an empty archive before full installs.
          package-manager-cache: false

      - name: Refresh pnpm lockfile
        run: pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile

      - name: Fail on unexpected file changes
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

      - name: Create or update pull request
        id: upsert-pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged, nothing to do."
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="chore/refresh-lockfile"
          REPO="$REPO_OWNER/paperclip"
          git config user.name "lockfile-bot"
          git config user.email "lockfile-bot@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): refresh pnpm-lock.yaml"
          git push --force origin "$BRANCH"

          # GITHUB_TOKEN is blocked from the GraphQL createPullRequest mutation,
          # so use the REST API instead, which works with contents:write +
          # pull-requests:write on push events.

          # Reuse an open PR from this repository owner only, not a fork with
          # the same branch name.
          pr_url="$(
            curl -s -f -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls?state=open&head=$REPO_OWNER:$BRANCH" \
              | python3 -c "
            import json,sys
            prs=json.load(sys.stdin)
            matches=[p for p in prs if p.get('head',{}).get('repo',{}).get('login')=='$REPO_OWNER']
            print(matches[0]['html_url'] if matches else '')
          " | tr -d '[:space:]')"

          if [ -z "$pr_url" ]; then
            pr_url="$(
              curl -s -f -X POST -H "Authorization: token $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -d "$(python3 -c "
            import json
            print(json.dumps({
              'head': '$REPO_OWNER:$BRANCH',
              'base': 'master',
              'title': 'chore(lockfile): refresh pnpm-lock.yaml',
              'body': 'Auto-generated lockfile refresh after dependencies changed on master. This PR only updates pnpm-lock.yaml.',
            }))
          ")" \
                "https://api.github.com/repos/$REPO/pulls" \
                | python3 -c "import json,sys; print(json.load(sys.stdin).get('html_url',''))"
            )"
            echo "Created new PR: $pr_url"
          else
            echo "PR already exists: $pr_url"
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Auto-merge lockfile PR (squash, delete branch)
        if: steps.upsert-pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL="${{ steps.upsert-pr.outputs.pr_url }}"
          REPO="$(python3 -c "import sys; p=sys.argv[1].split('/'); print('/'.join(p[2:4]))" "$PR_URL")"
          PR_NUMBER="$(python3 -c "import sys; p=sys.argv[1].split('/'); print(p[-1])" "$PR_URL")"
          echo "Merging PR #${PR_NUMBER} on ${REPO}"
          curl -s -f -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d '{"merge_method": "squash", "delete_branch": true}' \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/merge"
